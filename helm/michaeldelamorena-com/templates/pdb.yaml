{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "michaeldelamorena-com.fullname" . }}
  namespace: michaeldelamorena-com
  labels:
    {{- include "michaeldelamorena-com.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "michaeldelamorena-com.selectorLabels" . | nindent 6 }}
{{- end }}
