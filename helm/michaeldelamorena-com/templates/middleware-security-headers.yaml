{{- if .Values.ingress.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "michaeldelamorena-com.fullname" . }}-security-headers
  namespace: michaeldelamorena-com
  labels:
    {{- include "michaeldelamorena-com.labels" . | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      # Prevent clickjacking — personal site has no iframe embeds
      X-Frame-Options: "DENY"

      # Prevent MIME type sniffing
      X-Content-Type-Options: "nosniff"

      # Legacy XSS protection for older browsers
      X-XSS-Protection: "1; mode=block"

      # Force HTTPS for all future requests (1 year, includes subdomains, preload eligible)
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"

      # Control referrer information sent with outbound requests
      Referrer-Policy: "strict-origin-when-cross-origin"

      # Disable browser features not used by this site
      Permissions-Policy: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), midi=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), speaker-selection=(), sync-xhr=(), web-share=(), xr-spatial-tracking=()"

      # Content Security Policy
      # This is a static Next.js site; no API routes, no user-generated content.
      # Trusted external origins are documented in CLAUDE.md §Security.
      # Keep in Report-Only mode until CSP has been validated against real traffic.
      Content-Security-Policy-Report-Only: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
{{- end }}
