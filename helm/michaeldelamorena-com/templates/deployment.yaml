apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "michaeldelamorena-com.fullname" . }}
  namespace: michaeldelamorena-com
  labels:
    {{- include "michaeldelamorena-com.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "michaeldelamorena-com.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "michaeldelamorena-com.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: my-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          {{- if .Values.resumeVolume.enabled }}
          volumeMounts:
            - name: resume-content
              mountPath: {{ .Values.resumeVolume.mountPath }}
              # subPath avoids exposing the volume-root lost+found dir, which
              # Next.js would try to scandir under public/ and crash on (EACCES).
              subPath: {{ .Values.resumeVolume.subPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.resumeVolume.enabled }}
      volumes:
        - name: resume-content
          persistentVolumeClaim:
            claimName: {{ .Values.resumeVolume.claimName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
