# Traefik Middleware CRD — ModSecurity WAF
#
# Architecture: traefik-modsecurity-plugin intercepts every inbound request
# and forwards it to the modsecurity-michaeldelamorena-com service for WAF
# inspection BEFORE Traefik routes it to the app backend.
#
# Flow:
#   Traefik (websecure entrypoint)
#     → plugin sends request to modsecurity-michaeldelamorena-com:80
#     → ModSecurity inspects; returns 200 (pass) or 403 (block)
#     → On 200: Traefik routes to michaeldelamorena-com app pods
#     → On 403: Traefik returns 403 to the client
#
# Referenced in the Ingress annotation as:
#   default-modsecurity-michaeldelamorena-com@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: modsecurity-michaeldelamorena-com
  namespace: default
spec:
  plugin:
    traefik-modsecurity-plugin:
      modSecurityUrl: "http://modsecurity-michaeldelamorena-com.default.svc.cluster.local:80"
      # Timeout for WAF inspection per request (milliseconds)
      timeoutMillis: 5000
      # Maximum request body size forwarded for inspection (10 MB)
      maxBodySize: 10485760
